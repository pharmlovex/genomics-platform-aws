name: infra

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  # Applying is always a deliberate, manual action: Actions -> infra -> Run workflow.
  # (Required reviewers on environments need a public repo or GitHub Enterprise.)
  workflow_dispatch:
    inputs:
      action:
        description: "plan = read-only preview of main; apply = change AWS"
        type: choice
        options: [plan, apply]
        default: plan

# Explicit bash adds -o pipefail, so `terraform plan | tee` can't hide a failure.
defaults:
  run:
    shell: bash

permissions:
  contents: read
  id-token: write        # GitHub OIDC -> AWS, no long-lived keys
  pull-requests: write   # plan summary comment

env:
  TF_VERSION: "1.15.8"
  TF_IN_AUTOMATION: "true"
  WORKDIR: infra/envs/dev
  TF_VAR_github_repo: ${{ github.repository }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Format
        run: terraform fmt -check -recursive infra
      - name: Validate every root
        run: |
          for dir in infra/bootstrap infra/envs/dev; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
      - uses: terraform-linters/setup-tflint@v4
      - name: TFLint
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"
      - name: Checkov (security and compliance)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          config_file: .checkov.yml

  plan:
    needs: static-checks
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'plan')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Init
        run: |
          terraform -chdir="$WORKDIR" init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=envs/dev/terraform.tfstate" \
            -backend-config="region=eu-west-2"
      - name: Plan
        id: plan
        run: |
          terraform -chdir="$WORKDIR" plan -input=false -no-color -lock-timeout=5m -out=tfplan | tee plan.txt
      - name: Show plan in the run summary
        run: |
          { echo '### Terraform plan (dev)'; echo '```'; tail -c 60000 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Post plan to the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8');
            const summary = plan.split('\n').filter(l => /^Plan:|No changes/.test(l)).join('\n') || 'See job log';
            const body = `### Terraform plan (dev)\n\`${summary}\`\n<details><summary>Full plan</summary>\n\n\`\`\`\n${plan.slice(-60000)}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

  apply:
    needs: static-checks
    # Only a manual run, only from main. The dev environment's branch rule enforces
    # main again on GitHub's side, and the AWS trust policy only accepts environment:dev.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'apply' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    concurrency: terraform-dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Init
        run: |
          terraform -chdir="$WORKDIR" init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=envs/dev/terraform.tfstate" \
            -backend-config="region=eu-west-2"
      - name: Plan
        run: |
          terraform -chdir="$WORKDIR" plan -input=false -no-color -lock-timeout=5m -out=tfplan | tee plan.txt
          { echo '### Applied plan (dev)'; echo '```'; tail -c 60000 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Apply the saved plan
        # Applies exactly the plan above; fails as "stale" if state changed in between.
        run: terraform -chdir="$WORKDIR" apply -input=false -lock-timeout=5m tfplan
